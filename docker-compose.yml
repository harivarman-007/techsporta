services:
  # ── Backend: FastAPI + ML pipeline ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: empathai-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENABLE_STREAM_WS=${ENABLE_STREAM_WS:-0}
    volumes:
      # Mount a local model cache so models aren't re-downloaded on each restart
      - empathai-model-cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend: React/Vite served via nginx ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point the frontend at the backend — override for production deployment
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: empathai-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  empathai-model-cache:
